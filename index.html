<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALIEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1130;
    --navy-deep:#060a1e;
    --star:#f4f2ff;
    --outer:#3fa9f5;
    --space:#c04cd1;
    --flame:#ff8c42;
    --petal:#ff6f9c;
    --petal2:#ffb84c;
    --leaf:#4caf7d;
    --gold:#ffd76a;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1px 1px at 10% 20%, var(--star), transparent),
      radial-gradient(1px 1px at 80% 10%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, var(--star), transparent),
      radial-gradient(1px 1px at 30% 85%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 90% 60%, var(--star), transparent),
      radial-gradient(1px 1px at 45% 40%, var(--star), transparent),
      linear-gradient(180deg, var(--navy-deep), var(--navy));
    color:var(--star);
    font-family:'Baloo 2', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
    overflow-x:hidden;
  }
  .stage{position:relative;z-index:1;width:100%;max-width:460px;text-align:center;}
  .star-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .sound-toggle{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:2;
    width:38px;height:38px;border-radius:50%;border:none;padding:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    background:rgba(255,255,255,0.12);color:var(--star);
    box-shadow:0 2px 0 rgba(0,0,0,0.25);cursor:pointer;
  }
  .sound-toggle:active{transform:translateY(1px);}
  .twinkle-star{position:absolute;border-radius:50%;background:#fff;animation:twinkleStar ease-in-out infinite;}
  @keyframes twinkleStar{
    0%,100%{opacity:0.15;transform:scale(0.7);}
    50%{opacity:1;transform:scale(1.2);}
  }
  .shooting-star{position:absolute;width:1px;height:1px;}
  .ss-inner{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,0.9);
    opacity:0;animation:shootStar 1.6s ease-in forwards;
  }
  .ss-inner::before{
    content:'';position:absolute;top:0.5px;right:1px;width:90px;height:1px;
    background:linear-gradient(270deg, rgba(255,255,255,0.85), rgba(255,255,255,0));
  }
  @keyframes shootStar{
    0%{opacity:0;transform:translateX(0);}
    12%{opacity:1;}
    78%{opacity:1;}
    100%{opacity:0;transform:translateX(230px);}
  }
  h1{
    font-size:clamp(22px,6vw,30px);
    font-weight:800;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  h1 span{color:var(--gold);}
  .sub{margin:0 0 18px;opacity:0.75;font-size:15px;}
  .lives{display:flex;justify-content:center;gap:6px;margin:-6px 0 16px;}
  .lives svg{width:28px;height:28px;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3));}
  .lives-note{font-size:14px;opacity:0.9;margin:-6px 0 6px;min-height:22px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .mini-stars{display:inline-flex;gap:3px;}
  .mini-stars svg{width:18px;height:18px;}

  .tracks{display:flex;justify-content:center;gap:22px;margin-bottom:18px;}
  .lane{
    display:flex;flex-direction:column;align-items:center;
    width:120px;
  }
  .lane-label{font-weight:700;font-size:14px;margin-bottom:8px;}
  .lane-label.outer{color:var(--outer);}
  .lane-label.space{color:var(--space);}
  .track{
    position:relative;
    width:100%;
    height:280px;
    border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:2px solid rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .ticks{
    position:absolute;inset:8px 0 8px 10px;
    display:flex;flex-direction:column-reverse;justify-content:space-between;
    font-size:10px;opacity:0.55;
  }
  .finish-line{
    position:absolute;top:4px;left:0;right:0;
    text-align:center;font-size:14px;opacity:0.8;
  }
  .rocket{
    position:absolute;left:50%;bottom:6px;
    width:40px;height:76px;
    transform:translate(-50%,0);
    transition:bottom 0.7s cubic-bezier(.3,1.4,.5,1);
    filter:drop-shadow(0 3px 3px rgba(0,0,0,0.35));
  }
  .rocket.outer{--accent:#2f6fed;}
  .rocket.space{--accent:#ab47bc;}
  .rocket .body{
    position:absolute;top:4px;left:5px;width:30px;height:52px;
    background:linear-gradient(180deg,
      #ff8a70 0%, #ff6a52 12%, #e5342a 24%,
      #b8281c 24%, #b8281c 26.5%,
      #f6f6f6 26.5%, #f6f6f6 100%);
    box-shadow:
      inset 5px 0 6px -3px rgba(255,255,255,0.55),
      inset -5px 0 7px -3px rgba(0,0,0,0.28);
    clip-path:polygon(50% 0%,88% 20%,100% 30%,100% 100%,0% 100%,0% 30%,12% 20%);
  }
  .rocket .body::before,
  .rocket .body::after{
    content:'';position:absolute;left:1px;right:1px;height:7px;
    background:
      radial-gradient(circle at center, var(--gold) 34%, transparent 36%) repeat-x left center/8px 100%,
      var(--accent);
  }
  .rocket .body::before{top:32%;}
  .rocket .body::after{bottom:13px;}
  .rocket .win{
    position:absolute;top:17px;left:50%;transform:translateX(-50%);
    width:20px;height:20px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#eaf7ff 0%,#7fc4f2 45%,#2f6fed 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;color:var(--navy-deep);
    border:3px solid var(--gold);
    box-shadow:0 1px 2px rgba(0,0,0,0.3);
  }
  .rocket .fin{
    position:absolute;top:38px;width:15px;height:24px;
    background:linear-gradient(90deg,#e5342a 0%,#e5342a 34%,var(--gold) 34%,var(--gold) 46%,#e5342a 46%,#e5342a 100%);
    filter:brightness(0.96);
  }
  .rocket .fin.l{left:-10px;clip-path:polygon(100% 0%,100% 100%,0% 100%);}
  .rocket .fin.r{right:-10px;clip-path:polygon(0% 0%,0% 100%,100% 100%);}
  .rocket .flame{
    position:absolute;bottom:-15px;left:10px;
    width:20px;height:22px;border-radius:0 0 50% 50%;
    background:radial-gradient(ellipse at top,#fff3b0 0%,#ffb347 45%,#ff6a00 85%,transparent 100%);
    opacity:0;
  }
  .rocket.jet .flame{opacity:1;animation:flicker 0.2s infinite alternate;}
  @keyframes flicker{from{transform:scaleY(1);}to{transform:scaleY(1.25);}}

  .dice-row{display:flex;justify-content:center;gap:26px;margin-bottom:16px;}
  .die-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .die{
    width:56px;height:56px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;color:#fff;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,0.18);
  }
  .die.outer-die{background:#e5484d;}
  .die.space-die{background:#3f7ce8;}
  .die-label{font-size:12px;opacity:0.7;}

  button{
    font-family:inherit;font-weight:700;font-size:16px;
    border:none;border-radius:999px;padding:13px 30px;
    cursor:pointer;color:var(--navy-deep);
    background:var(--gold);
    box-shadow:0 4px 0 #c9a13f;
    transition:transform 0.12s;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9a13f;}
  button:disabled{opacity:0.5;cursor:default;box-shadow:0 4px 0 #8a8360;}
  .status{margin-top:12px;min-height:20px;font-size:14px;opacity:0.85;}

  .scene2{display:none;}
  .scene2.active{display:block;}
  .scene1.hidden{display:none;}
  .scene-challenge{display:none;}
  .scene-challenge.active{display:block;}
  .challenge-arena{
    position:relative;width:100%;max-width:320px;height:220px;margin:14px auto;
    border-radius:16px;border:2px solid rgba(255,255,255,0.15);
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    overflow:hidden;
  }
  .challenge-target{
    position:absolute;font-size:34px;cursor:pointer;user-select:none;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4));
    transition:left 0.15s ease-out, top 0.15s ease-out;
  }
  .challenge-target:active{transform:translate(-50%,-50%) scale(0.85);}
  .challenge-count{font-weight:700;font-size:16px;margin:4px 0;}
  .challenge-timerbar{
    width:220px;height:10px;margin:6px auto 10px;border-radius:6px;
    background:rgba(255,255,255,0.12);overflow:hidden;
  }
  .challenge-timerfill{height:100%;width:100%;background:var(--gold);border-radius:6px;}
  .challenge-msg{font-size:15px;font-weight:700;min-height:22px;color:var(--gold);}
  .launchpad{
    position:relative;height:200px;margin:10px auto 6px;width:40px;
  }
  .launchpad .rocket{bottom:0;left:0;transform:none;transition:none;}
  .launchpad.flying .rocket{
    animation:liftoff 1.1s cubic-bezier(.5,0,.4,1) forwards;
  }
  @keyframes liftoff{
    0%{bottom:0;opacity:1;}
    70%{opacity:1;}
    100%{bottom:340px;opacity:0;}
  }

  .garden{position:relative;display:flex;align-items:flex-end;justify-content:center;padding-top:6px;}
  .flower-pixel{position:relative;width:350px;height:320px;}
  .pixel{
    position:absolute;width:12px;height:12px;border-radius:2px;
    opacity:0;transform:scale(0);
    animation:pixel-pop 0.3s ease-out forwards;
    animation-play-state:paused;
  }
  .flower-pixel.bloom .pixel{animation-play-state:running;}
  @keyframes pixel-pop{to{opacity:1;transform:scale(1);}}
  .flower-wrap{position:absolute;inset:0;}
  .flower-wrap.sway{animation:sway 4.5s ease-in-out infinite;animation-play-state:paused;}
  .flower-pixel.bloom .flower-wrap.sway{animation-play-state:running;}
  @keyframes sway{0%,100%{transform:rotate(-1.5deg);}50%{transform:rotate(1.5deg);}}
  .sparkle{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 72%);
    opacity:0;animation:twinkle 1s ease-out forwards;animation-play-state:paused;
  }
  .flower-pixel.bloom .sparkle{animation-play-state:running;}
  @keyframes twinkle{
    0%{opacity:0;transform:scale(0) rotate(0deg);}
    40%{opacity:1;transform:scale(1.3) rotate(90deg);}
    100%{opacity:0;transform:scale(0.3) rotate(180deg);}
  }
  .bee-orbit{
    position:absolute;width:1px;height:1px;
    opacity:0;transition:opacity 0.4s;
    animation-timing-function:linear;animation-iteration-count:infinite;
    animation-play-state:paused;
  }
  .flower-pixel.bloom .bee-orbit{opacity:1;animation-play-state:running;}
  .bee-orbit .bee{position:absolute;left:-19.5px;top:-13.5px;width:39px;height:27px;cursor:pointer;}
  .star-spark{
    position:absolute;
    background:radial-gradient(circle, #fff8dc 0%, #ffd76a 55%, transparent 75%);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:0;animation:twinkle 0.8s ease-out forwards;pointer-events:none;
  }
  .bee-aura-ring{
    position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;border:2px solid rgba(255,244,168,0.9);
    box-shadow:0 0 8px 2px rgba(255,244,168,0.6);
    opacity:0.9;animation:beeAuraPulse 0.75s ease-out forwards;pointer-events:none;
  }
  @keyframes beeAuraPulse{
    0%{transform:scale(0.5);opacity:0.9;}
    100%{transform:scale(7);opacity:0;}
  }
  .ufo-bee{
    position:absolute;left:-13px;top:8px;width:26px;height:18px;
    opacity:0;pointer-events:none;
    animation:ufoBeeFly 1.3s ease-out forwards;
  }
  @keyframes ufoBeeFly{
    0%{opacity:0;transform:translate(0,0) scale(0.4);}
    18%{opacity:1;transform:translate(calc(var(--dx) * 0.3),calc(var(--dy) * 0.3)) scale(1);}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0.85);}
  }
  @keyframes orbit-cw{
    from{transform:rotate(0deg) translateX(var(--radius,120px)) rotate(0deg);}
    to{transform:rotate(360deg) translateX(var(--radius,120px)) rotate(-360deg);}
  }
  @keyframes orbit-ccw{
    from{transform:rotate(0deg) translateX(var(--radius,120px)) rotate(0deg);}
    to{transform:rotate(-360deg) translateX(var(--radius,120px)) rotate(360deg);}
  }
  .ufo-wrap{
    position:absolute;left:175px;top:-24px;width:0;height:0;
    opacity:0;transition:opacity 0.5s, transform 3s ease-in-out;
  }
  .flower-pixel.bloom .ufo-wrap{opacity:1;}
  .ufo{position:absolute;left:-55px;top:-20px;width:110px;height:55px;filter:drop-shadow(0 6px 5px rgba(0,0,0,0.4));cursor:pointer;}
  .ufo:active{transform:scale(0.92);}
  .ufo-light{animation:ufo-blink 1s steps(1) infinite;}
  .ufo-light:nth-of-type(2){animation-delay:0.25s;}
  .ufo-light:nth-of-type(3){animation-delay:0.5s;}
  .ufo-light:nth-of-type(4){animation-delay:0.75s;}
  @keyframes ufo-blink{0%,49%{opacity:1;}50%,100%{opacity:0.25;}}
  .beam{
    position:absolute;left:-34px;top:27px;width:68px;height:120px;
    background:linear-gradient(180deg, rgba(191,232,255,0.4), rgba(191,232,255,0));
    clip-path:polygon(35% 0%,65% 0%,100% 100%,0% 100%);
    opacity:0.25;animation:beam-pulse 2.4s ease-in-out infinite;
  }
  @keyframes beam-pulse{0%,100%{opacity:0.2;}50%{opacity:0.5;}}
  .beam.burst{
    animation:beam-burst 0.9s ease-out;
    background:linear-gradient(180deg, rgba(255,250,220,0.95), rgba(255,224,140,0.15));
  }
  @keyframes beam-burst{
    0%{opacity:0;height:120px;}
    35%{opacity:1;height:170px;}
    100%{opacity:0;height:170px;}
  }
  .flower-wrap{transition:filter 0.35s ease-out;}
  .flower-wrap.glow{filter:brightness(1.55) drop-shadow(0 0 14px rgba(255,244,168,0.85));}
  .win-text{font-size:19px;font-weight:800;color:var(--gold);margin:6px 0 0;opacity:0;transform:scale(0.4);transition:opacity 0.4s ease-out, transform 0.4s ease-out;}
  .win-text.show{opacity:1;transform:scale(1);}
  .build-caption{
    font-size:13px;opacity:0;min-height:18px;letter-spacing:0.3px;
    color:#cfd0f2;transition:opacity 0.25s ease-in-out;
  }
  .build-caption.show{opacity:0.85;}
  .again{margin-top:18px;opacity:0;transform:scale(0.4);transition:opacity 0.4s ease-out, transform 0.4s ease-out;}
  .again.show{opacity:1;transform:scale(1);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>
<div class="star-field" id="starField"></div>
<button class="sound-toggle" id="soundToggle" title="Suara">🔊</button>

<audio id="bloomSong" loop preload="auto" src="lagu.mp3"></audio>
<div class="stage">

  <div class="scene1" id="scene1">
    <h1>PEDUT <span>Space</span> Race</h1>
    <p class="sub">para versus bot</p>
    <div class="lives" id="livesRow"></div>

    <div class="tracks">
      <div class="lane">
        <div class="lane-label outer">PEDUT · PARA</div>
        <div class="track" id="trackOuter">
          <div class="finish-line">🏁 18</div>
          <div class="rocket outer" id="rocketOuter">
            <div class="win" id="winOuter">0</div>
            <div class="fin l"></div><div class="fin r"></div>
            <div class="body"></div>
            <div class="flame"></div>
          </div>
        </div>
      </div>
      <div class="lane">
        <div class="lane-label space">SPACE · BOT</div>
        <div class="track" id="trackSpace">
          <div class="finish-line">🏁 18</div>
          <div class="rocket space" id="rocketSpace">
            <div class="win" id="winSpace">0</div>
            <div class="fin l"></div><div class="fin r"></div>
            <div class="body"></div>
            <div class="flame"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="dice-row">
      <div class="die-wrap">
        <div class="die outer-die" id="dieOuter">⚀</div>
        <div class="die-label">PEDUT</div>
      </div>
      <div class="die-wrap">
        <div class="die space-die" id="dieSpace">⚀</div>
        <div class="die-label">BOT</div>
      </div>
    </div>

    <button id="rollBtn">LEMPAR PAR</button>
    <p class="status" id="status">Giliran mu</p>
  </div>

  <div class="scene-challenge" id="sceneChallenge">
    <h1> mainin ini dlu par!</h1>
    <p class="sub">BOT unggul </p>
    <div class="challenge-arena" id="challengeArena">
      <div class="challenge-target" id="challengeTarget">🛸</div>
    </div>
    <p class="challenge-count" id="challengeCount">0 / 6</p>
    <div class="challenge-timerbar"><div class="challenge-timerfill" id="challengeBar"></div></div>
    <p class="challenge-msg" id="challengeMsg"></p>
  </div>

  <div class="scene2" id="scene2">
    <h1 id="winnerTitle">Meluncur!</h1>
    <p class="lives-note" id="livesNote"></p>
    <div class="launchpad" id="launchpad"></div>
    <div class="garden">
      <div class="flower-pixel" id="flowerPixel"></div>
    </div>
    <p class="build-caption" id="buildCaption"></p>
    <p class="win-text" id="winText">DORR</p>
    <button class="again" id="againBtn">ULANG</button>
  </div>

</div>

<script>
  const FINISH = 18;
  const TRACK_USABLE = 260;
  const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  const USER_WEIGHTS = [1,1,2,2,2,3];
  const AI_WEIGHTS = [3,2,2,2,1,1];
  function weightedRoll(weights) {
    const total = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      if (r < weights[i]) return i+1;
      r -= weights[i];
    }
    return weights.length;
  }
  let pos = { outer: 0, space: 0 };
  let rolling = false;
  let finished = false;
  let lives = 3;
  const el = id => document.getElementById(id);

  let audioCtx = null;
  let soundOn = true;
  let bloomLoopTimer = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  function playNote(freq, time, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(vol || 0.15, time + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(time);
    osc.stop(time + dur + 0.05);
  }
  function startBloomMusic() {
    stopBloomMusic();
    const fileAudio = el('bloomSong');
    if (fileAudio && fileAudio.getAttribute('src')) {
      fileAudio.volume = 0.6;
      fileAudio.muted = !soundOn;
      fileAudio.currentTime = 0;
      fileAudio.play().catch(() => {});
      return;
    }
    if (!audioCtx) return;
    const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33];
    let step = 0;
    (function tick() {
      if (soundOn && audioCtx) {
        playNote(notes[step % notes.length], audioCtx.currentTime + 0.02, 0.55, 'triangle', 0.13);
      }
      step++;
      bloomLoopTimer = setTimeout(tick, 360);
    })();
  }
  function stopBloomMusic() {
    if (bloomLoopTimer) { clearTimeout(bloomLoopTimer); bloomLoopTimer = null; }
    const fileAudio = el('bloomSong');
    if (fileAudio) { fileAudio.pause(); fileAudio.currentTime = 0; }
  }
  el('soundToggle').addEventListener('click', () => {
    soundOn = !soundOn;
    el('soundToggle').textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) ensureAudio();
    const fileAudio = el('bloomSong');
    if (fileAudio) fileAudio.muted = !soundOn;
  });

  const STAR_COLORS = ['#ffb84c', '#c68fef', '#4fd1c5'];
  function starSVG(happy, color) {
    const mouth = happy ? 'M15,25 Q20,30 25,25' : 'M15,29 Q20,24 25,29';
    const blush = happy

  function buildOneFlower(flowerEl, theme, cx, cy, PIXEL, offset) {
    const wrap = document.createElement('div');
    wrap.className = 'flower-wrap';
    flowerEl.appendChild(wrap);

    function addPixel(x, y, color, delay) {
      const d = document.createElement('div');
      d.className = 'pixel';
      d.style.left = (x - PIXEL/2) + 'px';
      d.style.top = (y - PIXEL/2) + 'px';
      d.style.background = color;
      d.style.animationDelay = (delay + offset) + 's';
      wrap.appendChild(d);
    }

    const STEM_STEP = 0.06;
    const stemLen = 13;
    for (let v = 0; v < stemLen; v++) {
      addPixel(cx, cy + PIXEL*2 + v*PIXEL, '#4caf7d', v*STEM_STEP);
    }
    [[-1,6,0],[1,8,1]].forEach(([side, v, i]) => {
      const base = v*STEM_STEP + 0.12;
      addPixel(cx + side*PIXEL*1.6, cy + PIXEL*2 + v*PIXEL, '#4caf7d', base);
      addPixel(cx + side*PIXEL*2.5, cy + PIXEL*2 + v*PIXEL, '#4caf7d', base + 0.05);
      addPixel(cx + side*PIXEL*1.6, cy + PIXEL*2 + (v-1)*PIXEL, '#4caf7d', base - 0.03);
    });

    const petalRows = [
      {v:1, us:[-1,0,1]},
      {v:2, us:[-2,-1,0,1,2]},
      {v:3, us:[-2,-1,0,1,2]},
      {v:4, us:[-1,0,1]},
      {v:5, us:[-1,0,1]},
      {v:6, us:[0]},
      {v:7, us:[0]}
    ];
    const PETALS_START = stemLen*STEM_STEP + 0.35;
    const PETAL_DRAW_TIME = 0.4;
    const ROW_STAGGER = 0.045;
    for (let a = 0; a < theme.petals; a++) {
      const angle = a * (360/theme.petals) * Math.PI / 180;
      const cos = Math.cos(angle), sin = Math.sin(angle);
      petalRows.forEach(row => {
        row.us.forEach(u => {
          const lx = u * PIXEL, ly = -row.v * PIXEL;
          const x = cx + lx*cos - ly*sin;
          const y = cy + lx*sin + ly*cos;
          const color = row.v <= 2 ? theme.petal[0] : (row.v <= 4 ? theme.petal[1] : theme.petal[2]);
          addPixel(x, y, color, PETALS_START + a*PETAL_DRAW_TIME + (row.v-1)*ROW_STAGGER);
        });
      });
    }

    const hubDelay = PETALS_START + theme.petals*PETAL_DRAW_TIME + 0.15;
    for (let x = -2; x <= 2; x++) {
      for (let y = -2; y <= 2; y++) {
        if (Math.abs(x) === 2 && Math.abs(y) === 2) continue;
        const inner = Math.abs(x) <= 1 && Math.abs(y) <= 1;
        addPixel(cx + x*PIXEL, cy + y*PIXEL, inner ? theme.hubIn : theme.hubOut, hubDelay + Math.random()*0.15);
      }
    }
    addPixel(cx - 7, cy - PIXEL*2.1, theme.stamen, hubDelay + 0.4);
    addPixel(cx + 7, cy - PIXEL*2.1, theme.stamen, hubDelay + 0.45);
    addPixel(cx, cy - PIXEL*2.6, theme.stamen, hubDelay + 0.5);

    const totalDuration = hubDelay + 0.5 + 0.3 + 0.2;
    for (let i = 0; i < 6; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = 50 + Math.random() * 26;
      const size = 6 + Math.random() * 6;
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (cx + Math.cos(ang)*rad - size/2) + 'px';
      s.style.top = (cy + Math.sin(ang)*rad*0.7 - size/2) + 'px';
      s.style.animationDelay = (hubDelay + 0.55 + i*0.12 + offset) + 's';
      wrap.appendChild(s);
    }
    wrap.style.transformOrigin = cx + 'px ' + (cy + PIXEL*2 + stemLen*PIXEL) + 'px';
    wrap.style.animationDelay = (totalDuration + offset) + 's';
    wrap.classList.add('sway');

    return {
      wrap,
      label: theme.label,
      duration: totalDuration,
      stemDone: stemLen*STEM_STEP,
      petalsStart: PETALS_START,
      hubStart: hubDelay
    };
  }

  function buildFlower() {
    const flowerEl = el('flowerPixel');
    flowerEl.innerHTML = '';
    const PIXEL = 7;
    const slots = [ {cx:35, cy:152}, {cx:105, cy:133}, {cx:175, cy:120}, {cx:245, cy:133}, {cx:315, cy:152} ];
    const themes = [...FLOWER_THEMES].sort(() => Math.random() - 0.5).slice(0, 5);
    const STAGGER = 0.3;

    let maxDuration = 0, first = null;
    const labels = [];
    const flowerWraps = [];
    slots.forEach((slot, i) => {
      const r = buildOneFlower(flowerEl, themes[i], slot.cx, slot.cy, PIXEL, i*STAGGER);
      if (i === 0) first = r;
      maxDuration = Math.max(maxDuration, r.duration + i*STAGGER);
      labels.push(themes[i].label);
      flowerWraps.push(r.wrap);
    });

    addBees(flowerEl, maxDuration);
    addUFO(flowerEl, maxDuration, flowerWraps);

    return {
      label: labels.join(' · '),
      duration: maxDuration,
      stemDone: first.stemDone,
      petalsStart: first.petalsStart,
      hubStart: first.hubStart
    };
  }

      } else {
        el('livesNote').textContent = 'hayoloo';
        el('againBtn').textContent = 'ULANGI';
      }
    } else {
      el('livesNote').textContent = '';
      el('againBtn').textContent = 'ULANGI PAR';
    }

    const { label, duration, stemDone, petalsStart, hubStart } = buildFlower();
    el('winText').textContent = 'Pencet ufo sama lebah par sekalian kecilin volume';

    const caption = el('buildCaption');
    const say = (text, at) => setTimeout(() => {
      caption.textContent = text;
      caption.classList.add('show');
    }, at * 1000);
    caption.classList.remove('show');
    say('TANAM BUNGA', 0);
    say('TUMBUH', stemDone);
    say('MEKARRRR', petalsStart);
    say('SOME DETAIL AND DORRR', hubStart);
    setTimeout(() => caption.classList.remove('show'), duration * 1000 - 150);

    requestAnimationFrame(() => {
      pad.classList.add('flying');
      el('flowerPixel').classList.add('bloom');
    });
    startBloomMusic();
    setTimeout(() => {
      el('winText').classList.add('show');
      el('againBtn').classList.add('show');
    }, duration * 1000);
  }

  el('againBtn').addEventListener('click', () => {
    stopBloomMusic();
    if (lives <= 0) { lives = 3; renderLives(); }
    pos = { outer: 0, space: 0 };
    finished = false; rolling = false;
    place('outer'); place('space');
    el('rollBtn').disabled = false;
    el('status').textContent = 'TEKEN TOMBOL LAGI PAR';
    el('scene2').classList.remove('active');
    el('sceneChallenge').classList.remove('active');
    el('scene1').classList.remove('hidden');
    el('launchpad').classList.remove('flying');
    el('flowerPixel').classList.remove('bloom');
    el('flowerPixel').innerHTML = '';
    el('buildCaption').classList.remove('show');
  });
</script>
</body>
</html>
